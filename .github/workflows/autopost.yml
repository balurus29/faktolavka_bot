name: Автопостинг

on:
  schedule:
    # Запасной запуск каждые 20 минут с 08:00 до 23:59 МСК (время в UTC: 5-20).
    # Сам бот публикует пост только когда наступило время из POST_SLOTS (09:00, 13:00, 18:00, 21:00)
    # и пост за это время ещё не выходил. Основной точный запуск — через cron-job.org (см. README).
    - cron: "4,24,44 5-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Опубликовать сейчас, не дожидаясь расписания"
        type: boolean
        default: true
      type:
        description: "Формат поста"
        default: auto
        type: choice
        options: [auto, photo, album, video, mixed, text]

permissions:
  contents: write

concurrency:
  group: autopost

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Сертификат НУЦ Минцифры для GigaChat
        continue-on-error: true
        run: |
          cp "$(python -m certifi)" ru_bundle.pem
          for n in root sub; do
            curl -fsSL "https://gu-st.ru/content/lending/russian_trusted_${n}_ca_pem.crt" -o "ru_$n.crt" || continue
            sed -i 's/\r$//' "ru_$n.crt"
            # если файл двоичный (DER), переводим в текстовый PEM
            grep -q "BEGIN CERTIFICATE" "ru_$n.crt" || openssl x509 -inform DER -in "ru_$n.crt" -out "ru_$n.crt"
            if openssl x509 -in "ru_$n.crt" -noout -subject; then
              printf '\n' >> ru_bundle.pem
              cat "ru_$n.crt" >> ru_bundle.pem
              printf '\n' >> ru_bundle.pem
            fi
          done
          python -c "import ssl; ssl.create_default_context(cafile='ru_bundle.pem'); print('Сертификаты в порядке')"
          echo "GIGACHAT_CA_BUNDLE=$PWD/ru_bundle.pem" >> "$GITHUB_ENV"

      - name: Публикация
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_IMAGE_FALLBACK: ${{ vars.AI_IMAGE_FALLBACK }}
          CHANNEL_SIGNATURE: ${{ vars.CHANNEL_SIGNATURE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          POST_SLOTS: ${{ vars.POST_SLOTS }}
        run: python bot.py --type "${{ inputs.type || 'auto' }}" ${{ inputs.force && '--force' || '' }}

      - name: Сохранить историю постов
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "История постов" && git push)
