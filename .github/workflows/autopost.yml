name: Автопостинг

on:
  schedule:
    # Время в UTC. Москва = UTC+3.
    - cron: "7 6 * * *"     # 09:07 МСК
    - cron: "13 10 * * *"   # 13:13 МСК
    - cron: "21 15 * * *"   # 18:21 МСК
    - cron: "9 18 * * *"    # 21:09 МСК
  workflow_dispatch:
    inputs:
      type:
        description: "Формат поста"
        default: auto
        type: choice
        options: [auto, photo, album, video, mixed, text]

permissions:
  contents: write

concurrency:
  group: autopost

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Сертификат НУЦ Минцифры для GigaChat
        continue-on-error: true
        run: |
          cp "$(python -m certifi)" ru_bundle.pem
          for n in root sub; do
            curl -fsSL "https://gu-st.ru/content/lending/russian_trusted_${n}_ca_pem.crt" -o "ru_$n.crt" || continue
            sed -i 's/\r$//' "ru_$n.crt"
            # если файл двоичный (DER), переводим в текстовый PEM
            grep -q "BEGIN CERTIFICATE" "ru_$n.crt" || openssl x509 -inform DER -in "ru_$n.crt" -out "ru_$n.crt"
            if openssl x509 -in "ru_$n.crt" -noout -subject; then
              printf '\n' >> ru_bundle.pem
              cat "ru_$n.crt" >> ru_bundle.pem
              printf '\n' >> ru_bundle.pem
            fi
          done
          python -c "import ssl; ssl.create_default_context(cafile='ru_bundle.pem'); print('Сертификаты в порядке')"
          echo "GIGACHAT_CA_BUNDLE=$PWD/ru_bundle.pem" >> "$GITHUB_ENV"

      - name: Публикация
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          AI_IMAGE_FALLBACK: ${{ vars.AI_IMAGE_FALLBACK }}
          CHANNEL_SIGNATURE: ${{ vars.CHANNEL_SIGNATURE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python bot.py --type "${{ inputs.type || 'auto' }}"

      - name: Сохранить историю постов
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "История постов" && git push)
